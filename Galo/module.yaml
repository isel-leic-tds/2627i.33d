product: jvm/app

settings:
  compose: enabled
  kotlin:
    version: 2.4.20
    freeCompilerArgs:
      - -Xcollection-literals
      - -Xreturn-value-checker=full
      - -Xname-based-destructuring=complete

dependencies: 
  - $compose.material3
  - $compose.desktop.currentOs
  - com.squareup.okio:okio:3.18.2
  - org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1
  - org.mongodb:mongodb-driver-kotlin-sync:5.13.0